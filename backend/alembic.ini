# Alembic configuration (raw CLI) — added for Option B migration strategy
# See .opencode/plan/plan.md for decision record.
#
# The effective database URL is resolved by migrations/env.py:
#   - `flask db ...`  -> the Flask app's own engine (honours DATABASE_URL)
#   - `alembic ...`   -> DATABASE_URL from the environment / backend/.env
# Do not put a real credential here; this repo is public.

[alembic]
script_location = migrations

# Migration file template (matches flask_migrate default)
file_template = %%(rev)s_%%(slug)s
