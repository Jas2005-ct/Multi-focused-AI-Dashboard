[project]
name = "ai-dashboard-backend"
version = "1.0.0"
description = "AI Dashboard API with SQL Optimizer and OAuth"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "flask-openapi3[swagger]>=3.0.0",
    "authlib>=1.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "tenacity>=8.2.0",
    "sqlalchemy>=2.0.0",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "redis>=8.1.0",
    "celery>=5.6.3",
    "gunicorn>=21.0.0",
    "flask-limiter>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
package = false

[tool.uv.pip]
python-version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
