[project]
name = "ai-dashboard-backend"
version = "1.0.0"
description = "AI Dashboard API with SQL Optimizer and OAuth"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "flask-openapi3>=3.0.0",
    "authlib>=1.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "cryptography<3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
package = false

[tool.uv.pip]
python-version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
